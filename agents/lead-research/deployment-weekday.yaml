# Runs every weekday at 07:15 UK time. Each run is capped at $5 of list cost.
name: aibyao-lead-research-weekday
agent: ./agent.md
environment_id: ./environment.yaml
resources:
  - ./memory_store-history.yaml
# Fill in the vlt_... ID from claude-lock.json after applying vault.yaml (see README). Leave [] to run without Gmail drafts.
vault_ids: []
schedule: {type: cron, expression: "15 7 * * 1-5", timezone: Europe/London}
budget: {type: limit, max_list_cost: {amount: "500", currency: USD}}
initial_events:
  - type: user.define_outcome
    description: |
      Produce today's lead report for AI by AO: up to 8 new, well evidenced West Yorkshire small business leads for today's sector, with a personalised outreach draft for each, saved as leads-YYYY-MM-DD.md and leads-YYYY-MM-DD.csv in /mnt/session/outputs/, and add them to the lead history in the memory store.
    max_iterations: 3
    rubric:
      type: text
      content: |
        Starter rubric, tune as you learn what good leads look like.
        - Both files exist in /mnt/session/outputs/ with today's date in the filename, and the CSV has exactly the columns: date, business_name, town, sector, website, company_type, contact_route, contact_detail, best_service_fit, opportunity_score, top_signal, source_urls.
        - The report lists 8 leads, or fewer with a stated reason in the summary.
        - Every lead is an independent small business located in West Yorkshire, in today's sector, and its location is backed by a source URL.
        - No lead appears in the lead history file from earlier runs, and every new lead has been appended to that history file.
        - Every lead has at least two buying signals, each with a source URL that supports it.
        - Contact details come only from the business's own published business contact points; sole traders and partnerships are marked for phone or contact form, not email.
        - Each email draft is 60 to 120 words, references something specific and true about that business, proposes one concrete improvement, offers a free 20 minute call, signs off as Oliver from AI by AO, and ends with the opt out line.
        - Drafts use British English and contain no em dashes, no hyphenated words, and no invented claims, results or prices about AI by AO.
        - The summary states how many email drafts were posted to the Gmail drafts workflow and the HTTP status, or why they were not posted.
        - Each lead has an opportunity score from 1 to 10 with a one line reason and a best service fit from AI by AO's services.
